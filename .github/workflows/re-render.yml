# Re-render from a prior run's mid-pipeline artifact (no new script/TTS).
name: Re-render only

env:
  VPS_URL: ${{ secrets.VPS_WEBHOOK_URL }}
  VPS_SECRET: ${{ secrets.VPS_WEBHOOK_SECRET }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID with mid-pipeline artifact"
        required: true
        type: string
      replace_video_id:
        description: "Optional YouTube video ID to delete before re-upload"
        required: false
        type: string

jobs:
  re-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mid-pipeline
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg (ffprobe for validation)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install httpx

      - name: Verify render prerequisites on VPS
        run: |
          python - <<'PY'
          import json, os, sys
          import httpx

          meta = json.load(open("output/metadata.json"))
          render_mode = meta.get("render_mode", "slides")
          if render_mode == "slides":
              print("slide render — no movie library required")
              sys.exit(0)

          slug = meta.get("movie_slug") or meta.get("topic_slug")
          base = os.environ["VPS_URL"].rstrip("/")
          headers = {"Authorization": f"Bearer {os.environ['VPS_SECRET']}"}
          r = httpx.get(f"{base}/movies", headers=headers, timeout=60.0)
          r.raise_for_status()
          slugs = {m["slug"] for m in r.json().get("movies", [])}
          if slug not in slugs:
              sys.exit(f"Movie {slug!r} not on VPS.")
          print(f"movie on VPS: {slug}")
          PY

      - name: Resolve VPS run_id
        id: meta
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('output/metadata.json'))['run_id'])")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check VPS render status
        id: vps_check
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import httpx

          run_id = json.load(open("output/metadata.json"))["run_id"]
          base = os.environ["VPS_URL"].rstrip("/")
          headers = {"Authorization": f"Bearer {os.environ['VPS_SECRET']}"}
          try:
              r = httpx.get(f"{base}/runs/{run_id}/status", headers=headers, timeout=60.0)
              if r.status_code == 404:
                  status = "missing"
              else:
                  r.raise_for_status()
                  status = r.json().get("status", "missing")
          except Exception as exc:
              print(f"VPS status check failed: {exc}", flush=True)
              status = "missing"

          print(f"vps_status={status}", flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"vps_status={status}\n")
          PY

      - name: Trigger VPS clip render
        if: ${{ steps.vps_check.outputs.vps_status != 'complete' }}
        run: |
          ARGS=(--input output --run-id "${{ steps.meta.outputs.run_id }}")
          VPS_STATUS="${{ steps.vps_check.outputs.vps_status }}"
          if [ "$VPS_STATUS" = "running" ] || [ "$VPS_STATUS" = "failed" ]; then
            ARGS+=(--no-wipe)
          fi
          python src/trigger_vps.py "${ARGS[@]}"

      - name: Poll VPS until render complete
        if: ${{ steps.vps_check.outputs.vps_status != 'complete' }}
        run: python src/poll_vps.py --run-id "${{ steps.meta.outputs.run_id }}" --timeout 10800

      - name: Skip poll (VPS render already complete)
        if: ${{ steps.vps_check.outputs.vps_status == 'complete' }}
        run: echo "VPS render already complete for ${{ steps.meta.outputs.run_id }}"

      - name: Download final video from VPS
        run: python src/download_vps_output.py --run-id "${{ steps.meta.outputs.run_id }}" --output output

      - name: Validate render duration
        run: python src/validate_render.py --input output

      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: |
            output/final_video.mp4
            output/thumbnail.png
            output/captions.srt
            output/metadata.json
            output/youtube_seo.json
            output/script.txt
          if-no-files-found: error

      - run: pip install -r requirements.txt

      - name: Delete prior YouTube upload
        if: ${{ inputs.replace_video_id != '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python src/delete_youtube_video.py "${{ inputs.replace_video_id }}"

      - name: Phase 5 — YouTube upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "YouTube secrets not set — video saved as artifact only."
            exit 0
          fi
          test -s output/final_video.mp4 || exit 1
          test -s output/thumbnail.png || exit 1
          python src/phase5_upload.py \
            --video output/final_video.mp4 \
            --metadata output/metadata.json \
            --seo output/youtube_seo.json \
            --captions output/captions.srt \
            --thumbnail output/thumbnail.png

      - name: Cleanup VPS run artifacts
        if: success()
        run: python src/cleanup_vps.py --input output --skip-movie

      - name: Alert on success
        if: success()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: bash scripts/alert.sh "Re-render complete — run ${{ steps.meta.outputs.run_id }}"
